name: 3D models (Supabase function)

# Проверяет и публикует функцию generate-3d, которая строит 3D-модели поделок.
# Нужны секреты в Settings → Secrets and variables → Actions → Secrets:
#   SUPABASE_ACCESS_TOKEN — токен Supabase (supabase.com/dashboard/account/tokens)
#   TRIPO_API_KEY         — ключ Tripo (developers.tripo3d.ai → API Keys)
#   MESHY_API_KEY         — вместо Tripo можно ключ Meshy; если заданы оба, берётся Tripo
# Без них workflow только проверяет код.

on:
  push:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-3d.yml'
  workflow_dispatch:

env:
  PROJECT_REF: xluymkhepmzbokgrmjtq

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check --node-modules-dir=none supabase/functions/generate-3d/index.ts
      - name: Unit tests
        run: deno test --node-modules-dir=none supabase/functions/generate-3d/
      - name: Which secrets are set
        run: |
          for name in SUPABASE_ACCESS_TOKEN TRIPO_API_KEY MESHY_API_KEY; do
            if [ -n "${!name}" ]; then echo "$name: задан"; else echo "$name: нет"; fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Бесплатная проверка ключа: запрос несуществующей задачи. Неверный ключ Tripo
      # отвечает кодом 1000, верный — «задача не найдена». Заодно печатаем баланс кредитов.
      - name: Check Tripo key and balance (free)
        if: ${{ env.TRIPO_API_KEY != '' }}
        run: |
          auth="Authorization: Bearer $TRIPO_API_KEY"
          body=$(curl -s -H "$auth" https://openapi.tripo3d.ai/v3/tasks/00000000-0000-0000-0000-000000000000)
          echo "$body"
          if [ "$(echo "$body" | jq -r '.code')" = 1000 ]; then echo "::error::Tripo не принял ключ"; exit 1; fi
          # В API v3 баланса нет, он есть только в v2 (Tripo обещает закрыть v2 1 ноября 2026).
          echo "Баланс: $(curl -s -H "$auth" https://api.tripo3d.ai/v2/openapi/user/balance)"
      # Полная проверка строит одну модель и тратит кредиты, поэтому только по ручному
      # запуску или по пушу с [smoke] в сообщении коммита.
      - name: Smoke test (тратит кредиты на одну модель)
        if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]')) && (env.TRIPO_API_KEY != '' || env.MESHY_API_KEY != '') }}
        run: deno run --allow-net --allow-env supabase/functions/generate-3d/smoke.ts

  deploy:
    needs: check
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      # Без ключей публиковать нечего. При ручном запуске это ошибка, а при обычном пуше —
      # только предупреждение, чтобы ветка не краснела, пока ключи не добавлены.
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="SUPABASE_ACCESS_TOKEN"
          [ -n "$TRIPO_API_KEY$MESHY_API_KEY" ] || missing="$missing TRIPO_API_KEY"
          if [ -z "$missing" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          msg="Не заданы секреты: $missing (Settings → Secrets and variables → Actions)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::$msg. Функция не опубликована."
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest
      - name: Set secrets and deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -- --project-ref "$PROJECT_REF"
          if [ -n "$TRIPO_API_KEY" ]; then supabase secrets set "$@" TRIPO_API_KEY="$TRIPO_API_KEY"; fi
          if [ -n "$MESHY_API_KEY" ]; then supabase secrets set "$@" MESHY_API_KEY="$MESHY_API_KEY"; fi
          supabase functions deploy generate-3d "$@" --no-verify-jwt
